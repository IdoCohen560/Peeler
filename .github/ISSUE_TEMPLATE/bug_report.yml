name: Bug report
description: Report a reproducible problem with Peeler.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Check the current support and validation notes first. Please use synthetic or public sample files and do not share private files.
  - type: input
    id: version
    attributes:
      label: Peeler version or commit
      placeholder: v0.2.0-dev.1 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux (X11)
        - Linux (Wayland)
        - macOS (Apple silicon)
        - macOS (Intel)
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the source and target format if this is a conversion issue.
      placeholder: 1. Open Peeler…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error text or logs
      description: Remove personal paths, tokens, and sensitive information before posting.
    validations:
      required: false
