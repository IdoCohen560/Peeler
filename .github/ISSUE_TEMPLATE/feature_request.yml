name: Feature request
description: Suggest a format, workflow, or platform improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      placeholder: Describe the task you are trying to complete.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Peeler to do?
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Relevant platform or file formats
      placeholder: Windows, macOS, HEIC to PNG, etc.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or extra context
    validations:
      required: false
